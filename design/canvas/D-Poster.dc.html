<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E8E4F5}
</style>
</helmet>
<div style="width: 880px; height: 600px; box-sizing: border-box; background: #1E2A5A; color: #FFFFFF; font-family: Unbounded, 'Arial Black', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 36px 40px 0; display: flex; flex-direction: column; gap: 6px; min-height: 0">
<p style="margin: 0; font-size: 20px; font-weight: 400">Snow in the Naryn basin</p>
<p style="margin: 0; font-size: 178px; font-weight: 900; line-height: 0.92; letter-spacing: -8px">+0.20</p>
<p style="margin: 0; font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -1px">centimetres deeper every decade. Proven.</p>
</div>
<div style="background: #B8232F; padding: 22px 40px 26px; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -0.5px">Across the border in the Pamir, the Vakhsh lost 1.94 cm a decade.</p>
<p style="margin: 0; font-size: 15px; font-weight: 400; line-height: 1.4">Same snow, opposite direction. NASA data for 1981 to 2025, Mann-Kendall test: Naryn p = 0.048, Vakhsh p = 0.003.</p>
</div>
</div>
