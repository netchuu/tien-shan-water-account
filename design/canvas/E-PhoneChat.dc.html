<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#0A5A52}a:hover{color:#063B36}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 780px; box-sizing: border-box; background: #F1F4F0; color: #162421; font-family: Onest, 'Segoe UI', sans-serif; display: flex; flex-direction: column">
<header style="padding: 18px 18px 14px; background: #0A5A52; color: #FFFFFF">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">Water Account</h1>
<p style="margin: 2px 0 0; font-size: 14px; color: #D6EAE6">Ask about the snow above your river</p>
</header>
<div style="flex: 1; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
<p style="margin: 0; align-self: flex-end; max-width: 78%; background: #0A5A52; color: #FFFFFF; padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 16px">Is the snow in the Naryn basin changing?</p>
<div style="align-self: flex-start; max-width: 92%; background: #FFFFFF; padding: 14px 14px 12px; border-radius: 16px 16px 16px 4px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3">Yes. Snow depth has risen by 0.20 cm per decade since 1981.</p>
<svg viewBox="0 0 400 120" preserveAspectRatio="none" role="img" aria-label="Yearly snow depth in the Naryn basin with a rising trend line" style="display: block; width: 100%; height: 96px">
<path d="M6.0 38.8 L14.8 71.8 L23.6 56.1 L32.5 61.7 L41.3 67.9 L50.1 58.3 L58.9 49.0 L67.7 54.8 L76.5 49.0 L85.4 72.9 L94.2 73.5 L103.0 54.8 L111.8 41.1 L120.6 64.2 L129.5 87.0 L138.3 50.6 L147.1 106.6 L155.9 67.1 L164.7 47.5 L173.5 49.2 L182.4 58.8 L191.2 66.4 L200.0 49.0 L208.8 61.2 L217.6 73.9 L226.5 55.4 L235.3 86.6 L244.1 87.6 L252.9 36.1 L261.7 54.2 L270.5 49.2 L279.4 62.1 L288.2 75.8 L297.0 73.5 L305.8 30.9 L314.6 59.2 L323.5 49.2 L332.3 30.5 L341.1 44.8 L349.9 13.4 L358.7 50.0 L367.5 34.4 L376.4 61.2 L385.2 40.5 L394.0 22.4" style="fill: none; stroke: #8A9A96; stroke-width: 1.5; vector-effect: non-scaling-stroke"></path>
<path d="M6.0 64.2 L394.0 45.9" style="fill: none; stroke: #0A5A52; stroke-width: 3.5; vector-effect: non-scaling-stroke"></path>
</svg>
<p style="margin: 0; font-size: 15px; line-height: 1.4">This is proven: the test gives p = 0.048, so it is unlikely to be chance. It is a record of the past, not a forecast.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
<button type="button" style="min-height: 44px; padding: 8px 14px; border-radius: 22px; border: 1.5px solid #0A5A52; background: #FFFFFF; color: #0A5A52; font-size: 15px; font-weight: 500">Compare with the Pamir</button>
<button type="button" style="min-height: 44px; padding: 8px 14px; border-radius: 22px; border: 1.5px solid #0A5A52; background: #FFFFFF; color: #0A5A52; font-size: 15px; font-weight: 500">What does it mean for a dispatcher?</button>
<button type="button" style="min-height: 44px; padding: 8px 14px; border-radius: 22px; border: 1.5px solid #0A5A52; background: #FFFFFF; color: #0A5A52; font-size: 15px; font-weight: 500">Show the yearly numbers</button>
</div>
</div>
<form style="padding: 10px 14px 16px; background: #FFFFFF; border-top: 1px solid #CBD5D1; display: flex; flex-direction: column; gap: 6px">
<label for="q" style="font-size: 13px; color: #45554F">Your question</label>
<div style="display: flex; gap: 8px">
<input id="q" type="text" placeholder="Is it getting warmer in Vakhsh?" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 8px 12px; border: 1.5px solid #6B7C77; border-radius: 8px; font-family: inherit; font-size: 16px; color: #162421">
<button type="button" style="min-height: 44px; padding: 8px 16px; border-radius: 8px; border: none; background: #0A5A52; color: #FFFFFF; font-size: 16px; font-weight: 700">Ask</button>
</div>
</form>
</div>
</x-dc>
